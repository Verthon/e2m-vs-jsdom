name: Integration Tests (jsdom)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run jsdom tests
        run: npm run test:jsdom:ci
